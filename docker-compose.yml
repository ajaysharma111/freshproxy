# Check https://github.com/maximhq/bifrost for the current image name, port and provider-key setup.
services:
  bifrost:
    image: maximhq/bifrost
    ports: ["8080:8080"]
    volumes: ["./bifrost-data:/app/data"]
  freshproxy:
    build: .
    ports: ["8787:8787"]
    environment:
      BIFROST_URL: http://bifrost:8080
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      BIFROST_MODELS: ${BIFROST_MODELS:-openai/gpt-4o-mini}
    depends_on: [bifrost]
