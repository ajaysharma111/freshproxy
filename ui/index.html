<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreshProxy</title>
<style>
:root{--bg:#0f1720;--card:#16212d;--line:#263548;--tx:#e8eef5;--mu:#93a4b8;--ok:#2fbf8a;--warn:#e9b44c;--bad:#ef6a63;--ac:#5aa9ff}
@media(prefers-color-scheme:light){:root{--bg:#f4f7fb;--card:#fff;--line:#dbe3ec;--tx:#14202e;--mu:#5d6f84}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:20px 16px 60px}h1{font-size:22px;margin:0}h1 span{color:var(--ac)}
.sub{color:var(--mu);margin:4px 0 18px}.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.mock{background:var(--warn);color:#222;border-color:transparent}
textarea,input{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:130px;resize:vertical}button{background:var(--ac);color:#06121f;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--line)}button:disabled{opacity:.5}.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.score{font-size:34px;font-weight:800}.c-current{color:var(--ok)}.c-unverified{color:var(--warn)}.c-changed{color:var(--bad)}
.claim h3{margin:0 0 4px;font-size:15px}.meta{color:var(--mu);font-size:13px}a{color:var(--ac)}pre{white-space:pre-wrap;margin:0;font:inherit}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.stats{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Fresh<span>Proxy</span> <span id="mode" class="badge"></span></h1>
<p class="sub">Paste an AI answer. FreshProxy finds claims that may have gone stale, re-checks them on the live web (Tavily), judges them through the Bifrost gateway, and scores each one for freshness.</p>
<textarea id="ans" placeholder="Paste an LLM answer here…"></textarea>
<div class="row"><button id="go">Check freshness</button><button class="sec" id="sample" hidden>Load demo sample</button></div>
<div class="row"><input id="q" placeholder="…or ask a question and verify the model's answer"><button class="sec" id="ask">Ask &amp; verify</button></div>
<div id="out"></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=l=>l==='current'?'var(--ok)':l==='changed'?'var(--bad)':'var(--warn)';
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
function show(r){
  const ov=r.overall;const l=ov==null?'unverified':ov>=.7?'current':ov<=.3?'changed':'unverified';
  const t=r.stats.tavily,b=r.stats.bifrost;
  $('out').innerHTML=`<div class="card"><div class="meta">Overall freshness</div><div class="score c-${l}">${ov==null?'—':Math.round(ov*100)+'%'}</div>
   <div class="meta">${r.claims.length} time-sensitive claim(s) checked · claims found by ${r.extraction==='llm'?'the model':'built-in rules (gateway unavailable)'} · ${r.stats.elapsed_s}s</div></div>`+
  (r.claims.length?'':'<div class="card">No time-sensitive claims were found in this answer.</div>')+
  r.claims.map(c=>`<div class="card claim"><h3>${esc(c.text)}</h3>
   <div class="meta"><b style="color:${col(c.label)}">${c.label.toUpperCase()}</b> · ${Math.round(c.freshness*100)}% · ${esc(c.category)} · verdict: ${esc(c.verdict)}</div>
   <div class="bar"><i style="width:${c.freshness*100}%;background:${col(c.label)}"></i></div>
   <div>${esc(c.reason)}</div>${c.current_value?`<div><b>Now:</b> ${esc(c.current_value)}</div>`:''}
   <div class="meta">${c.sources.length?c.sources.map(s=>`<a target="_blank" rel="noopener" href="${esc(s.url)}">[${s.n}] ${esc(s.title||s.url)}</a>${s.date?' ('+esc(s.date)+')':''}`).join('<br>'):'No usable source supports a verdict.'}</div></div>`).join('')+
  (r.corrected_answer?`<div class="card"><div class="meta">Corrected answer</div><pre>${esc(r.corrected_answer)}</pre></div>`:'')+
  `<div class="stats"><div class="card"><div class="meta">Tavily (live evidence)</div>${t.searches} searches · ${t.cache_hits} cached · ${t.errors} errors</div>
   <div class="card"><div class="meta">Bifrost (model gateway)</div>${b.calls} calls · ${b.prompt_tokens+b.completion_tokens} tokens · fallbacks used: ${b.fallbacks_used}<br>${esc(Object.entries(b.models_used).map(([k,v])=>k+' ×'+v).join(', '))}</div></div>
   <p class="meta">${esc(r.disclaimer)}</p>`;
}
async function run(fn){$('go').disabled=$('ask').disabled=true;$('out').innerHTML='<div class="card">Checking claims against live sources…</div>';
  try{show(await fn())}catch(e){$('out').innerHTML='<div class="card" style="border-color:var(--bad)">'+esc(e.message)+'</div>'}$('go').disabled=$('ask').disabled=false}
$('go').onclick=()=>run(()=>post('/api/verify',{answer:$('ans').value}));
$('ask').onclick=()=>run(async()=>{const r=await post('/api/ask',{question:$('q').value});$('ans').value=r.original_answer;return r});
fetch('/api/health').then(r=>r.json()).then(h=>{const m=$('mode');m.textContent=h.mock?'MOCK DEMO DATA':'live';if(h.mock)m.classList.add('mock');
  if(h.sample){$('sample').hidden=false;$('sample').onclick=()=>$('ans').value=h.sample}else if(!h.tavily_configured){m.textContent='live · TAVILY_API_KEY missing'}});
</script></body></html>
