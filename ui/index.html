<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreshProxy</title>
<style>
:root{--bg:#0f1720;--card:#16212d;--line:#263548;--tx:#e8eef5;--mu:#93a4b8;--ok:#2fbf8a;--warn:#e9b44c;--bad:#ef6a63;--ac:#5aa9ff}
@media(prefers-color-scheme:light){:root{--bg:#f4f7fb;--card:#fff;--line:#dbe3ec;--tx:#14202e;--mu:#5d6f84}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 70px}h1{font-size:22px;margin:0}h1 span.a{color:var(--ac)}
.sub{color:var(--mu);margin:4px 0 16px}.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.mock{background:var(--warn);color:#222;border-color:transparent}
textarea,input{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:120px;resize:vertical}button{background:var(--ac);color:#06121f;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--line)}button:disabled{opacity:.5}.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.score{font-size:36px;font-weight:800;line-height:1}.c-current{color:var(--ok)}.c-unverified{color:var(--warn)}.c-changed{color:var(--bad)}.c-conflict{color:var(--warn)}
.claim h3{margin:0 0 4px;font-size:15px}.meta{color:var(--mu);font-size:13px}a{color:var(--ac)}pre{white-space:pre-wrap;margin:0;font:inherit}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.grid{grid-template-columns:1fr}}
mark{border-radius:4px;padding:1px 3px;cursor:pointer;color:inherit}mark.current{background:#2fbf8a44}mark.changed{background:#ef6a6366}mark.unverified{background:#e9b44c55}
del{background:#ef6a6344;text-decoration:line-through}ins{background:#2fbf8a44;text-decoration:none}
.steps div{padding:3px 0;color:var(--mu)}.steps div.done{color:var(--tx)}.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--ac);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:12px;border:1px solid var(--line);margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.claim.flash{outline:2px solid var(--ac)}
</style></head><body><main>
<h1>Fresh<span class="a">Proxy</span> <span id="mode" class="badge"></span></h1>
<p class="sub">Paste an AI answer. FreshProxy finds claims that may have gone stale, re-checks them on the live web (Tavily), judges them through the Bifrost gateway, and scores each one for freshness.</p>
<textarea id="ans" placeholder="Paste an LLM answer here…"></textarea>
<div class="row"><button id="go">Check freshness</button><button class="sec" id="sample" hidden>Load demo sample</button></div>
<div class="row"><input id="q" placeholder="…or ask a question and verify the model's answer"><button class="sec" id="ask">Ask &amp; verify</button></div>
<div id="out"></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=l=>l==='current'?'var(--ok)':l==='changed'?'var(--bad)':'var(--warn)';
let LAST=null;
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}

/* word-level diff (LCS) for the corrected answer */
function diff(a,b){const x=a.split(/(\s+)/),y=b.split(/(\s+)/),n=x.length,m=y.length;if(n*m>250000)return esc(b);
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=x[i]===y[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,o='';while(i<n&&j<m){if(x[i]===y[j]){o+=esc(x[i]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){o+='<del>'+esc(x[i])+'</del>';i++}else{o+='<ins>'+esc(y[j])+'</ins>';j++}}
  while(i<n)o+='<del>'+esc(x[i++])+'</del>';while(j<m)o+='<ins>'+esc(y[j++])+'</ins>';return o}

function highlighted(r){let h=esc(r.original_answer||''),used=[];
  r.claims.forEach((c,i)=>{const t=esc(c.text),k=h.toLowerCase().indexOf(t.toLowerCase());if(k<0)return;
    h=h.slice(0,k)+`<mark class="${c.conflict?'unverified':c.label}" data-i="${i}" title="${esc(c.label)}">`+h.slice(k,k+t.length)+'</mark>'+h.slice(k+t.length)});return h}

function card(c,i){const l=c.conflict?'conflict':c.label,cs=c.consensus||{};
  return `<div class="card claim" id="c${i}"><h3>${esc(c.text)}</h3>
   <div class="meta"><b class="c-${l}">${l==='conflict'?'SOURCES CONFLICT':c.label.toUpperCase()}</b> · ${Math.round(c.freshness*100)}% · ${esc(c.category)} · verdict: ${esc(c.verdict)}</div>
   <div class="bar"><i style="width:${c.freshness*100}%;background:${col(c.label)}"></i></div>
   <div>${esc(c.reason)}</div>${c.current_value?`<div><b>Now:</b> ${esc(c.current_value)}</div>`:''}
   ${(cs.supports||cs.contradicts||cs.neutral)?`<div class="meta">Evidence: <span class="pill c-current">${cs.supports||0} support</span><span class="pill c-changed">${cs.contradicts||0} contradict</span><span class="pill">${cs.neutral||0} neutral</span></div>`:''}
   <div class="meta">Shelf life ≈ ${c.shelf_life_days} days · re-check by ${esc(c.recheck_by)}</div>
   <div class="meta">${c.sources.length?c.sources.map(s=>`<a target="_blank" rel="noopener" href="${esc(s.url)}">[${s.n}] ${esc(s.title||s.url)}</a>${s.official?' <span class="pill c-current">official</span>':''}${s.date?' ('+esc(s.date)+')':''}`).join('<br>'):'No usable source supports a verdict.'}</div></div>`}

function show(r){LAST=r;const ov=r.overall,l=ov==null?'unverified':ov>=.7?'current':ov<=.3?'changed':'unverified',t=r.stats.tavily,b=r.stats.bifrost;
  const nch=r.claims.filter(c=>c.label==='changed').length,ncu=r.claims.filter(c=>c.label==='current').length;
  $('out').innerHTML=`<div class="card"><div class="meta">Overall freshness</div><div class="score c-${l}">${ov==null?'—':Math.round(ov*100)+'%'}</div>
   <div class="meta">${r.claims.length} claim(s) checked: ${nch} changed · ${ncu} current · ${r.claims.length-nch-ncu} unverified · found by ${r.extraction==='llm'?'the model':'built-in rules (gateway unavailable)'} · ${r.stats.elapsed_s}s</div>
   <div class="row"><button class="sec" id="dlmd">Download report (.md)</button><button class="sec" id="dljson">Download JSON</button></div></div>
   <div class="card"><div class="meta">Your answer, highlighted (click a highlight to jump to its evidence)</div><pre id="hl">${highlighted(r)}</pre></div>`+
  (r.claims.length?'':'<div class="card">No time-sensitive claims were found in this answer.</div>')+r.claims.map(card).join('')+
  (r.corrected_answer?`<div class="card"><div class="meta">Corrected answer (changes marked)</div><pre>${diff(r.original_answer||'',r.corrected_answer)}</pre></div>`:'')+
  `<div class="grid"><div class="card"><div class="meta">Tavily (live evidence)</div>${t.searches} searches · ${t.cache_hits} cached · ${t.errors} errors</div>
   <div class="card"><div class="meta">Bifrost (model gateway)</div>${b.calls} calls · ${b.prompt_tokens+b.completion_tokens} tokens · fallbacks used: ${b.fallbacks_used} · errors: ${b.errors}</div></div>
   <div class="card"><div class="meta">Gateway trace: every model call went through Bifrost</div><table><tr><th>Task</th><th>Model</th><th>Time</th><th>Tokens</th><th></th></tr>${(b.trace||[]).map(x=>`<tr><td>${esc(x.task||'-')}</td><td>${esc(x.model)}</td><td>${x.ms} ms</td><td>${x.tokens}</td><td>${x.ok?(x.fallback?'fallback':'ok'):'<span class="c-changed">failed</span>'}</td></tr>`).join('')}</table></div>
   <p class="meta">${esc(r.disclaimer)}</p>`;
  document.querySelectorAll('#hl mark').forEach(m=>m.onclick=()=>{const c=$('c'+m.dataset.i);c.scrollIntoView({behavior:'smooth',block:'center'});c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1600)});
  $('dljson').onclick=()=>save('freshproxy-report.json',JSON.stringify(r,null,2),'application/json');
  $('dlmd').onclick=()=>save('freshproxy-report.md',markdown(r),'text/markdown')}
function save(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function markdown(r){return `# FreshProxy report\n\nOverall freshness: **${r.overall==null?'n/a':Math.round(r.overall*100)+'%'}**\n\n`+r.claims.map(c=>`## ${c.label.toUpperCase()} (${Math.round(c.freshness*100)}%): ${c.text}\n- Category: ${c.category}\n- Verdict: ${c.verdict}${c.conflict?' (sources conflict)':''}\n- ${c.reason}\n${c.current_value?'- Now: '+c.current_value+'\n':''}- Re-check by: ${c.recheck_by}\n${c.sources.map(s=>`- Source [${s.n}]: ${s.title} ${s.url}${s.date?' ('+s.date+')':''}`).join('\n')}\n`).join('\n')+(r.corrected_answer?`\n## Corrected answer\n\n${r.corrected_answer}\n`:'')+`\n_${r.disclaimer}_\n`}

async function runStream(answer){
  const steps=[];const draw=()=>{$('out').innerHTML='<div class="card steps">'+steps.map(s=>`<div class="${s.done?'done':''}">${s.done?'✓':'<span class="spin"></span>'}${esc(s.text)}</div>`).join('')+'</div>'};
  const add=t=>{steps.forEach(s=>s.done=true);steps.push({text:t});draw()};
  add('Starting…');
  const res=await fetch('/api/verify-stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer})});
  if(!res.ok)throw new Error((await res.json()).error||res.status);
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',final=null,n=0,total=0;
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let k;while((k=buf.indexOf('\n'))>=0){const line=buf.slice(0,k);buf=buf.slice(k+1);if(!line.trim())continue;const m=JSON.parse(line);
      if(m.event==='step')add(m.data.text);
      else if(m.event==='claims'){total=m.data.count;add('Found '+total+' time-sensitive claim(s) ('+(m.data.method==='llm'?'model':'rules')+'); checking them on the live web…')}
      else if(m.event==='claim'){n++;steps.forEach(s=>s.done=true);steps.push({text:'Checked '+n+'/'+total+': '+m.data.claim.text.slice(0,70)+' → '+m.data.claim.label.toUpperCase(),done:true});draw()}
      else if(m.event==='done')final=m.data;else if(m.event==='error')throw new Error(m.data.error)}}
  if(!final)throw new Error('The connection closed before the report was complete.');return final}
async function run(get){$('go').disabled=$('ask').disabled=true;try{show(await get())}catch(e){$('out').innerHTML='<div class="card" style="border-color:var(--bad)">'+esc(e.message)+'</div>'}$('go').disabled=$('ask').disabled=false}
$('go').onclick=()=>run(()=>runStream($('ans').value.trim()));
$('ask').onclick=()=>run(async()=>{$('out').innerHTML='<div class="card"><span class="spin"></span>Asking the model through Bifrost…</div>';const r=await post('/api/ask',{question:$('q').value});$('ans').value=r.original_answer;r.original_answer=r.original_answer;return r});
fetch('/api/health').then(r=>r.json()).then(h=>{const m=$('mode');m.textContent=h.mock?'MOCK DEMO DATA':'live';if(h.mock)m.classList.add('mock');
  if(h.sample){$('sample').hidden=false;$('sample').onclick=()=>$('ans').value=h.sample}else if(!h.tavily_configured){m.textContent='live · TAVILY_API_KEY missing'}});
</script></body></html>
